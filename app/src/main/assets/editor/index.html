<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#fffdf3">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>编辑工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23338555'/%3E%3Cpath d='m8 15 17-8-8 18-2-8-7-2 17-8-10 10' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="native.css">
  <script defer src="vendor/editor-engine.bundle.js"></script>
  <script defer src="vendor/gsap.min.js"></script>
  <script defer src="archive-button-press.js"></script>
  <script defer src="editor-motion.js"></script>
  <script defer src="app.js"></script>
  <script defer src="context-tools.js"></script>
  <script defer src="native.js"></script>
</head>
<body>
  <main class="phone" id="phone" aria-label="文章编辑工作台">
    <div class="status-bar" aria-hidden="true">
      <span class="clock">0:42</span>
      <div class="status-icons">
        <svg viewBox="0 0 12 20" class="bluetooth"><path d="m3 5 7 9-4 4V2l4 4-7 9"/></svg>
        <svg viewBox="0 0 20 20"><path d="M17 13A8 8 0 0 1 7 3a8 8 0 1 0 10 10Z" fill="currentColor" stroke="none"/></svg>
        <span class="signal"><small>4G</small><i></i><i></i><i></i><i></i></span>
        <span class="signal"><small>4G</small><i></i><i></i><i></i><i></i></span>
        <span class="status-dot"></span>
      </div>
    </div>

    <header class="header">
      <button class="icon-button back" id="back-button" data-action="back" aria-label="返回"><span data-icon="back"></span></button>
      <span class="preview-label" id="preview-label" hidden>预览</span>
      <button class="icon-button more" id="more-button" data-action="menu" aria-label="更多选项" aria-expanded="false" aria-controls="overflow-menu"><span data-icon="more"></span></button>
      <button class="send-button" data-action="send" aria-label="检查并预览文章"><span class="press-surface" data-press-surface aria-hidden="true"></span><span data-icon="send"></span></button>
    </header>

    <section class="writing-area" id="writing-area" aria-label="编辑内容">
      <div class="title-field">
        <textarea id="topic-title" aria-label="标题" rows="1" placeholder="标题" spellcheck="false"></textarea>
        <span class="title-count" id="title-count" aria-live="polite">0 字</span>
      </div>
      <div id="rich-editor" class="body-editor rich-document"></div>
    </section>

    <article id="preview" class="preview rich-document" aria-label="文章预览" hidden>
      <img id="preview-cover" class="preview-cover" alt="封面" hidden>
      <h1 id="preview-title"></h1>
      <p id="preview-summary" class="preview-summary" hidden></p>
      <div id="preview-body"></div>
    </article>

    <div class="body-count counter" id="body-count"><span id="body-count-value">0 / 20</span></div>

    <section class="island" id="island" aria-label="编辑工具">
      <button class="grabber" id="grabber" data-action="expand" aria-label="展开格式工具" aria-expanded="false"><span></span></button>
      <div class="drawer-pages" id="drawer-pages" inert>
        <section class="drawer-page tools-scroll" id="tools-scroll" aria-label="格式工具" inert>
          <div class="tool-grid" id="common-tools"></div>
          <h2>格式</h2>
          <div class="tool-grid" id="format-tools"></div>
          <h2>对齐</h2>
          <div class="tool-grid" id="alignment-tools"></div>
          <h2>插入</h2>
          <div class="tool-grid" id="insert-tools"></div>
        </section>
        <section class="drawer-page details-page" id="details-page" aria-label="摘要与封面" inert>
          <div class="details-heading">
            <label for="topic-summary">摘要</label>
            <span id="summary-count">0/255</span>
          </div>
          <textarea id="topic-summary" rows="4" maxlength="255" placeholder="选填"></textarea>
          <div class="details-heading cover-heading">
            <span>封面</span>
            <button type="button" id="remove-cover" data-action="remove-cover" hidden>移除</button>
          </div>
          <button type="button" class="cover-upload" id="cover-upload" data-action="pick-cover" aria-label="上传封面">
            <img id="cover-thumbnail" alt="封面" draggable="false" hidden>
            <span data-icon="image"></span>
            <span id="cover-upload-label">上传</span>
          </button>
        </section>
      </div>
      <div class="island-footer">
        <div class="metadata-row">
          <div class="history-shortcuts" aria-label="编辑历史">
            <button class="icon-button" data-tool="undo" aria-label="撤销"><span data-icon="undo"></span></button>
            <button class="icon-button" data-tool="redo" aria-label="重做"><span data-icon="redo"></span></button>
          </div>
          <div class="page-indicator" id="page-indicator" data-page="0" role="group" aria-label="抽屉分页">
            <svg class="page-dots" viewBox="0 0 64 32" aria-hidden="true">
              <g class="page-dot-track"><circle cx="20" cy="16" r="3.5"/><circle cx="44" cy="16" r="3.5"/></g>
              <g class="page-dot-liquid">
                <circle class="liquid-dot" cx="20" cy="16" r="4.5"/>
              </g>
            </svg>
            <button type="button" class="page-dot-button" data-drawer-page="0" aria-label="第 1 页：格式工具" aria-controls="tools-scroll" aria-pressed="true"></button>
            <button type="button" class="page-dot-button" data-drawer-page="1" aria-label="第 2 页：摘要与封面" aria-controls="details-page" aria-pressed="false"></button>
          </div>
          <div class="editing-control-group" aria-label="文本操作与光标">
            <button class="editing-control" id="content-button" data-action="content-actions" aria-label="文本操作" aria-expanded="false" aria-controls="editing-actions"><span data-icon="content"></span></button>
            <button class="editing-control" id="cursor-button" data-action="cursor-controls" aria-label="光标控制，按住拖动移动光标" aria-expanded="false" aria-controls="cursor-controls"><span data-icon="cursor"></span></button>
          </div>
        </div>
        <div class="bottom-row">
          <div class="bottom-tools">
            <div class="quick-tools" id="quick-tools"></div>
            <button class="customize-button" id="customize-button" data-action="customize" aria-pressed="false" inert><span data-icon="pen"></span><span>自定义</span></button>
          </div>
          <button class="expand-button icon-button" id="expand-button" data-action="expand" aria-label="展开格式工具" aria-expanded="false"><span data-icon="up"></span></button>
        </div>
      </div>
      <div class="editing-popover" id="editing-actions" role="group" aria-label="文本操作菜单" hidden>
        <button type="button" data-content-action="selectAll"><span data-icon="selectAll"></span><span>全选</span></button>
        <button type="button" data-content-action="copy"><span data-icon="copy"></span><span>复制</span></button>
        <button type="button" data-content-action="cut"><span data-icon="cut"></span><span>剪切</span></button>
        <button type="button" data-content-action="paste"><span data-icon="paste"></span><span>粘贴</span></button>
      </div>
      <div class="editing-popover cursor-popover" id="cursor-controls" role="group" aria-label="光标控制面板" hidden>
        <div class="cursor-grid">
          <button type="button" data-move="up" aria-label="光标上移"><span data-icon="up"></span></button>
          <button type="button" data-move="left" aria-label="光标左移"><span data-icon="left"></span></button>
          <button type="button" id="select-button" data-action="toggle-select" aria-pressed="false" aria-label="选择文字"><span class="select-label" aria-hidden="true">选择文字</span></button>
          <button type="button" data-move="right" aria-label="光标右移"><span data-icon="right"></span></button>
          <button type="button" data-move="down" aria-label="光标下移"><span data-icon="down"></span></button>
        </div>
      </div>
    </section>

    <button class="menu-dismiss" id="menu-dismiss" aria-label="关闭更多选项" hidden></button>
    <div class="overflow-menu" id="overflow-menu" role="menu" aria-label="更多选项" hidden>
      <div class="save-status" role="status"><span data-icon="cloud"></span><span id="save-label">草稿自动保存</span></div>
      <button id="cloud-save" data-action="cloud-save" role="menuitem" hidden><span data-icon="cloud"></span><span>同步到云端</span></button>
      <button id="cloud-reload" data-action="cloud-reload" role="menuitem" hidden><span data-icon="cloud"></span><span>重新读取云端</span></button>
      <button id="cloud-copy" data-action="cloud-copy" role="menuitem" hidden><span data-icon="pen"></span><span>另存为新草稿</span></button>
      <button id="cloud-export" data-action="cloud-export" role="menuitem" hidden><span data-icon="book"></span><span>导出 Markdown</span></button>
      <button data-action="preview" role="menuitem"><span data-icon="book"></span><span>预览</span></button>
      <button class="destructive" data-action="discard" role="menuitem"><span data-icon="trash"></span><span>舍弃</span></button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog id="action-dialog" aria-labelledby="dialog-title">
      <form id="dialog-form">
        <div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭" autofocus><span data-icon="close"></span></button></div>
        <div id="dialog-content"></div>
        <div class="dialog-actions" id="dialog-actions"></div>
      </form>
    </dialog>
    <input type="file" id="image-picker" accept="image/*" hidden>
    <input type="file" id="cover-picker" accept="image/jpeg,image/png,image/webp" hidden>
  </main>
</body>
</html>
