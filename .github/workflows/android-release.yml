name: Android release draft

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release source
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag must point to a commit on origin/main."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '25'

      - name: Run unit tests and build unsigned APK
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease

      - name: Sign and verify APK
        id: apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          version_name=$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "::error::The tag must be v$version_name to match the APK version."
            exit 1
          fi
          if [[ -z "$ANDROID_KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "::error::Configure the three signing secrets and ANDROID_KEY_ALIAS in android-release."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          keystore=$(mktemp "$RUNNER_TEMP/semiovert-keystore.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"

          apk="$RUNNER_TEMP/Semi-Overt-${GITHUB_REF_NAME}.apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose "$apk"
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Create draft release with verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$release_tags"; then
            echo "::error::A release already exists for $GITHUB_REF_NAME. Review it before rerunning."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Semi-Overt $GITHUB_REF_NAME" --generate-notes
