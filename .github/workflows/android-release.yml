name: Android release draft

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tag:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.created && !github.event.deleted }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          def version_at(commit):
              config = subprocess.check_output(
                  ["git", "show", f"{commit}:app/build.gradle.kts"], encoding="utf-8"
              )
              codes = re.findall(r"(?m)^[ \t]*versionCode[ \t]*=[ \t]*([1-9][0-9]*)[ \t]*(?://.*)?$", config)
              names = re.findall(r'(?m)^[ \t]*versionName[ \t]*=[ \t]*"([^"\n]+)"[ \t]*(?://.*)?$', config)
              if len(codes) != 1 or len(names) != 1:
                  raise SystemExit(f"::error::Expected literal versionCode and versionName at {commit}.")
              return int(codes[0]), names[0]

          previous_code, previous_name = version_at(os.environ["BEFORE_SHA"])
          code, name = version_at(os.environ["GITHUB_SHA"])
          if code <= previous_code or name == previous_name:
              print("Release skipped: versionCode must increase and versionName must change.")
          else:
              tag = f"v{name}"
              if not re.fullmatch(r"v[0-9][0-9A-Za-z._+-]*", tag):
                  raise SystemExit("::error::Use a versionName like 1.1.0 or 1.1.0-beta.1.")
              subprocess.run(["git", "check-ref-format", f"refs/tags/{tag}"], check=True)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print(f"tag={tag}", file=output)
          PY

      - name: Create tag and dispatch release
        if: ${{ steps.version.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ref="refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "$ref"; then
            if [[ "$(git rev-parse "$ref^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to a different commit. Choose a new versionName."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field "ref=$ref" --raw-field "sha=$GITHUB_SHA" --silent
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/dispatches" \
            --raw-field "ref=$RELEASE_TAG"

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !github.event.deleted }}
    runs-on: ubuntu-24.04
    environment: android-release
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release source
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag must point to a commit on origin/main."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '25'

      - name: Run unit tests and build unsigned APK
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease

      - name: Sign and verify APK
        id: apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          version_name=$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "::error::The tag must be v$version_name to match the APK version."
            exit 1
          fi
          if [[ -z "$ANDROID_KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "::error::Configure the three signing secrets and ANDROID_KEY_ALIAS in android-release."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          keystore=$(mktemp "$RUNNER_TEMP/semiovert-keystore.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"

          apk="$RUNNER_TEMP/Semi-Overt-${GITHUB_REF_NAME}.apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose "$apk"
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Create draft release with verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$release_tags"; then
            echo "::error::A release already exists for $GITHUB_REF_NAME. Review it before rerunning."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Semi-Overt $GITHUB_REF_NAME" --generate-notes
